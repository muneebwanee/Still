# Illustrative coturn configuration: adapt addresses, certificates and firewall for your host.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_THE_SAME_RANDOM_TURN_SECRET
realm=turn.example.com
server-name=turn.example.com
cert=/path/to/fullchain.pem
pkey=/path/to/privkey.pem
min-port=49160
max-port=49260
user-quota=4
total-quota=200
no-multicast-peers
no-cli
# On a NATed host also set external-ip=PUBLIC_IP/PRIVATE_IP.
# Deny relay access to private/loopback destinations in your network/firewall.
# Firewall to permit 3478 TCP/UDP, 5349 TCP and the selected UDP relay port range.
# This template is not enabled by compose; deploy and review TURN separately.
